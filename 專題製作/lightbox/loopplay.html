<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/css/textslider.css">

    <style>
        .slideText {
            /* 顯示行數的高度 */
            height: 7.3rem;
        }

        .slideText ul li {
            font-size: 2rem;
        }
    </style>
</head>

<body>
    <!-- 圖片顯示區 -->
    <h1>文字輪播</h1>
    <hr>
    <div class="slideText">
        <ul>
            <li>new1</li>
            <li>new2</li>
            <li>new3</li>
            <li>new4</li>
            <li>new5</li>
            <li>new6</li>
            <li>new7</li>
            <li>new8</li>
            <li>new9</li>
        </ul>
    </div>
    <!-- 主程式 -->
    <script src="/js/jquery-1.11.3.min.js"></script>
    <script src="/js/jquery.textslider.js"></script>
    <script>
        $(function () {
            $('.slideText').textslider({
                direction: 'scrollUp', // 捲動方向: scrollUp向上, scrollDown向下
                scrollNum: 1, // 一次捲動幾個<li>
                scrollSpeed: 800, // 捲動速度(ms)
                pause: 4200  // 停頓時間(ms)
            });
        });
    </script>
</body>

</html>
