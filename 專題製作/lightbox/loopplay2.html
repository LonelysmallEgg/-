<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 500px;
            height: 300px;
            position:relative;
        }

        #imgCycle {
            width: 100%;
            height: 100%;
            position:absolute;
        }

        #imgCycle img {
            width: 100%;
            height: 100%;
        }

        #nav {
            position: absolute;
            z-index: 99;
            right: 10px;
            bottom: 10px;
        }

        #nav a {
            font-size: 20px;
            color: #000;
            text-decoration: none;
            border: 1px solid #fff;
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-left: 5px;
        }

        #nav a:hover {
            background-color: yellow;
            color: #000;
        }

        /* a作用中的狀態 */
        #nav a.activeSlide {
            background-color: brown;
        }
    </style>
</head>

<body>
    <div class="box">
        <!-- 輪播圖 -->
        <div id="imgCycle">
            <img src="/images/03.jpg" alt="">
            <img src="/images/04.jpg" alt="">
            <img src="/images/05.jpg" alt="">
            <img src="/images/06.jpg" alt="">
            <img src="/images/07.jpg" alt="">
        </div>
    </div>
    <!-- 輪播導覽器 -->
    <!-- <div id="nav">
        <a href="">1</a>
        <a href="">2</a>
        <a href="">3</a>
        <a href="">4</a>
        <a href="">5</a>
    </div> -->

    <script src="/js/jquery-1.11.3.min.js"></script>
    <script src="/js/jquery.cycle.all.js"></script>
    <script>
        $(function () {
            $('#imgCycle').after('<div id="nav"></div>').cycle({
                pager:'#nav',
                fx:'turnUp',
                speed:500,
                timeout:500,
            });
        });
    </script>
</body>

</html>
